<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Contact</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, Arial, sans-serif;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px;
      width: 100%;
      max-width: 480px;
      color: white;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.5); margin-bottom: 32px; font-size: 14px; }
    label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 16px;
      color: white;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus {
      border-color: rgba(99,179,237,0.6);
    }
    textarea { resize: vertical; min-height: 120px; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    ::placeholder { color: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <h1>✉️ Contactez-moi</h1>
    <p>Remplissez le formulaire ci-dessous et je vous répondrai rapidement.</p>
    <label>Prénom</label>
    <input type="text" placeholder="Votre prénom"/>
    <label>Nom</label>
    <input type="text" placeholder="Votre nom"/>
    <label>Message</label>
    <textarea placeholder="Votre message..."></textarea>
    <button>Envoyer le message</button>
  </div>
</body>
</html>
